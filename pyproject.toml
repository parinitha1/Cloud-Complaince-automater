[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ccaudit"
version = "0.1.0"
description = "Map ISO 27001, SOC 2 and India DPDP Act controls to automated cloud security checks"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
aws = ["boto3>=1.34"]
dev = ["pytest>=8", "boto3>=1.34"]

[project.scripts]
ccaudit = "ccaudit.cli:main"

[tool.setuptools]
packages = ["ccaudit"]

[tool.setuptools.package-data]
ccaudit = ["frameworks/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
